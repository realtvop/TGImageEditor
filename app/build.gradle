plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.realtvop.tgimageeditor'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.realtvop.tgimageeditor'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':editor-ui')
    implementation project(':editor-engine')
    implementation project(':nekogram-core')
}
